spring.application.name=switch-simulator
server.port=${SERVER_PORT:9993}
server.servlet.context-path=/switch-simulator

# ---------------------------------------------------------------------------
# ISO 8583 listener. The switch-gateway connects here as a client.
# ---------------------------------------------------------------------------
switch.simulator.iso-port=6661
spring.main.allow-circular-references=true

# ---------------------------------------------------------------------------
# Fixed technical 1LINK parameters for the simulated switch side.
# These are institution-level values, never transaction data.
#   DE-32 acquirer id, DE-33 forwarding institution id (1LINK sets this),
#   DE-43 card acceptor name and location (25 + 13 + 2 per 1LINK spec 9.33).
# ---------------------------------------------------------------------------
switch.simulator.acquirer-institution-code=999982
switch.simulator.forwarding-institution-code=000001
switch.simulator.card-acceptor-name=DFS
switch.simulator.card-acceptor-city=ISLAMABAD
switch.simulator.country-code=PK
switch.simulator.currency-code=586

# Mock outcome. DE-39 "00" = PROCESSED OK (1LINK spec 9.30).
switch.simulator.default-response-code=00

logging.level.root=INFO
logging.level.com.dfs.switchsimulator=INFO

# ---------------------------------------------------------------------------
# Utility Bill Payment (1LINK UBP). DE-03 for the two messages.
# PROVISIONAL: must match onelink.processing-code.* in switch-gateway, and both
# must be confirmed against the UBP section of the 1LINK spec.
# ---------------------------------------------------------------------------
switch.simulator.processing-code.bill-inquiry=380000
switch.simulator.processing-code.bill-payment=500000
