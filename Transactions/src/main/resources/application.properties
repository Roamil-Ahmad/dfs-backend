spring.application.name=transactions
server.port=${SERVER_PORT:8009}

# ---- springdoc / Swagger UI ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

server.servlet.context-path=/transactions
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class=oracle.jdbc.driver.OracleDriver
jwt.expiry.time=15
generate.otp.url=${THIRDPARTIES_BASE_URL:http://thirdparties:8008}/thirdparties/genrateOtp
verify.otp.url=${THIRDPARTIES_BASE_URL:http://thirdparties:8008}/thirdparties/verifyOtp
default.session.time=15
account.type.wallet=10
account.type.agent=30
sms.template.type.qr.trxn=CLTF
push.notification.url=${PUSHNOTIFICATION_BASE_URL:http://pushnotification:8012}/firbase/api/notify/
card.titlefetch.url=${APS_BASE_URL}/apsclient/cardTitleFetch
wallet.to.card.url=${APS_BASE_URL}/apsclient/walletToCard
mpin.verification.url=${APP_BASE_URL:http://app:8002}/app/v1/mpinVerification
card.to.wallet.url=${APS_BASE_URL}/apsclient/cardToWallet
card.balance.inquiry.url=${APS_BASE_URL}/apsclient/balanceInquiry
card.to.card.url=${APS_BASE_URL}/apsclient/cardToCard
bill.info.url=${APS_BASE_URL}/apsclient/savePaymentInfo
bill.payment.url=${APS_BASE_URL}/apsclient/savePayment
cashin.url=${APS_BASE_URL}/apsclient/cashin
cashout.url=${APS_BASE_URL}/apsclient/cashout
wallet.to.wallet.url=${APS_BASE_URL}/apsclient/walletToWallet
mobile.channelCode=MOB
location.gadm.directory=/opt/tomcat/document
#location.gadm.directory=C:\\Users\\muhammad.kashif\\Downloads\\LatLongData
location.district.filename=gadm41_AFG_2.json
location.province.filename=gadm41_AFG_1.json
mobile.clientSecret=${MOBILE_CLIENT_SECRET}
# AgentApp owns MPIN verification, not the APS card host.
# dfs-agentapp is published on 18001, which is one of the externally open ports.
agent.mpin.verification.url=${AGENTAPP_BASE_URL:http://agentapp:8001}/agentapp/v1/mpinVerification
# DFS issuer BIN, the first six digits of DE-02. 900419 belongs to BarakatPay and was carried over
# by the migration, so it is replaced here by a placeholder in the 9-series, which ISO reserves for
# national and private use. Replace with the BIN 1LINK / SBP actually assigns to DFS Pakistan.
dfs.bin=958214
pos.channelCode=POS
pos.clientSecret=${POS_CLIENT_SECRET}
purchase.url=${APS_BASE_URL}/apsclient/purchase
card.to.card.cp.url=${APS_BASE_URL}/apsclient/cardToCardCp
agent.channelCode=AGNT
agent.clientSecret=${AGENT_CLIENT_SECRET}

# ---------------------------------------------------------------------------
# Switched transactions (IBFT today; bill payment and wallet-to-wallet later).
# The switch gateway owns the ISO 8583 link to 1LINK; all services run on the
# same host so these are direct internal calls.
# ---------------------------------------------------------------------------
switch.gateway.title-fetch.url=${SWITCH_GATEWAY_BASE_URL:http://switch-gateway:9995}/switch-gateway/outgoing/title-fetch
switch.gateway.advice.url=${SWITCH_GATEWAY_BASE_URL:http://switch-gateway:9995}/switch-gateway/outgoing/advice
switch.gateway.timeout-ms=60000

# PKG_MW credentials. VALIDATE_TOKEN matches CLIENT_SECRET + CHANNEL_CODE + USER_ID
# against one TBL_MW_CHANNEL row; any mismatch returns 1046 - Invalid Token.
# CHANNEL_CODE here is the numeric TBL_MW_CHANNEL code (0108 = MB, mobile banking),
# not the alphabetic MOB/POS/AGNT codes used by the older token table.
# USER_ID is the MW service account that owns the channel row, never the customer.
switching.mw.channelCode=${MW_CHANNEL_CODE:MOB}
switching.mw.userId=${MW_USER_ID:100}
# No default on purpose: the secret is supplied by the environment so it is never
# committed to the repository or baked into the image.
switching.mw.clientSecret=${MW_CLIENT_SECRET}

# Fixed technical 1LINK parameters for the DFS acquirer side. Institution level
# only - never transaction data. Field references are to the 1LINK ISO 8583
# Data Element Definitions v7.0.
onelink.acquirer-institution-code=999982
onelink.network-identifier=001
onelink.merchant-type=0003
onelink.point-of-entry=002
onelink.currency-code=586
onelink.card-acceptor-terminal-id=00000001
onelink.card-acceptor-identification-code=000000000000001
onelink.card-acceptor-name-and-location=DFS                      ISLAMABAD    PK

# ---------------------------------------------------------------------------
# Bill payment through the switch (1LINK UBP). Same gateway, different routes.
# ---------------------------------------------------------------------------
switch.gateway.bill-inquiry.url=${SWITCH_GATEWAY_BASE_URL:http://switch-gateway:9995}/switch-gateway/outgoing/bill-inquiry
switch.gateway.bill-payment.url=${SWITCH_GATEWAY_BASE_URL:http://switch-gateway:9995}/switch-gateway/outgoing/bill-payment
# DE-18 merchant category for a utility bill, distinct from the IBFT one.
onelink.merchant-type-bill=6012

# Corporate Portal: shared key presented in X-Portal-Key, and the token-free customer MPIN
# endpoint on app that the portal funds-transfer path verifies against. No default on the key:
# an unset deployment must fail to start rather than serve transaction APIs unauthenticated.
corporate.portal.apiKey=${CORPORATE_PORTAL_API_KEY}
corporate.mpin.verification.url=${APP_BASE_URL:http://app:8002}/app/v1/corporate/mpinVerification
