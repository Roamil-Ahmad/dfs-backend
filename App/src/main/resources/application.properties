# ---- springdoc / Swagger UI (OpenAPI 3) ----
# With context-path /app -> OpenAPI JSON: /app/v3/api-docs , Swagger UI: /app/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
# Set to false in production to disable the interactive UI (the spec can stay enabled if needed).
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# ---- Outgoing HTTP client timeouts (WebClient + RestTemplate) ----
# Caps how long a call waits so a slow/down downstream can't hold a Tomcat worker thread.
http.client.connect-timeout-ms=3000
http.client.read-timeout-ms=30000

# ---- Lookup cache auto-refresh (count-based change detection) ----
# Every interval, a cheap COUNT(*) per reference table; if the count changed (e.g. a new value
# was added), the affected cache(s) are evicted so the next request reloads fresh data.
cache.refresh.interval-ms=120000

# ---------------------------------------------------------------------------
# Multipart upload limits for the KYC document endpoints.
# file-size-threshold=0 makes Tomcat stream every part straight to disk instead
# of buffering it in the heap - that is what keeps a multi-document KYC request
# off the Java heap, and it is the whole point of accepting multipart here.
# max-swallow-size must stay at least as large as max-request-size: if a request
# is rejected mid-body Tomcat has to read the rest before it can reply, and when
# it cannot it resets the connection, which the client sees as
# "unexpected end of stream" rather than the real error.
# ---------------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=0
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB

# Shared key the Corporate Portal presents in the X-Portal-Key header to reach the token-free
# customer MPIN verification used by the Transactions portal funds-transfer path. No default on
# purpose: an unset deployment must fail to start rather than verify MPINs unauthenticated.
corporate.portal.apiKey=${CORPORATE_PORTAL_API_KEY}

