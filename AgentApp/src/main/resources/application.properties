spring.application.name=agentapp
server.port=${SERVER_PORT:8001}

# ---- springdoc / Swagger UI ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

server.servlet.context-path=/agentapp
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class=oracle.jdbc.driver.OracleDriver
jwt.expiry.time=15
generate.otp.url=${THIRDPARTIES_BASE_URL:http://thirdparties:8008}/thirdparties/genrateOtp
verify.otp.url=${THIRDPARTIES_BASE_URL:http://thirdparties:8008}/thirdparties/verifyOtp
nadra.cnic.verification.url=${NADRA_BASE_URL:http://nadra:9994}/nadra/v1/cnicVerification
account.reg.type.code=A
account.status.active=AS01
# LKP_ACCOUNT_TYPE only defines 10 and 20. The previous value, 30, matched no row, so the account
# type lookup returned nothing. Every account opened here is a wallet, which is 10.
account.type.code=10
# Corporate onboarding books its account as registration type C (CORPORATE, id 5); an ordinary
# agent stays A. Kept as a property so the code can move without a rebuild.
corporate.account.reg.type.code=C
account.level.three=L3
account.level.two=L2
account.level.one=L1
doc.sourceOfIncome.code=SOI
doc.proofOfAddress.code=POA
doc.nidFront.code=TF
doc.nidBack.code=TB
doc.selfie.code=SF
status.pending.code=PD
sms.template.Type=FWR
sms.template.type.reset.pin=RP
file.upload.path=/opt/tomcat/webapps/document
doc.path=/opt/tomcat/webapps/
account.level.five=L5
account.level.six=L6
geo.code.url=${THIRDPARTIES_BASE_URL:http://thirdparties:8008}/thirdparties/reverse-geocode
generate.notification.url=${THIRDPARTIES_BASE_URL:http://thirdparties:8008}/thirdparties/generateNotification
bank.code=BKTY
sms.template.registration=CCW
base.url=${APS_BASE_URL}/
unlock.time=2
workflow.url=${WORKFLOW_BASE_URL:http://workflow:8010}/workflow
portal.token=${AGENTAPP_PORTAL_TOKEN}

# Shared key the Corporate Portal presents in the X-Portal-Key header to reach the token-free
# replicas of changempin, getbalance and miniStatment. No default on purpose: an unset deployment
# must fail to start rather than serve account data unauthenticated.
corporate.portal.apiKey=${CORPORATE_PORTAL_API_KEY}
doc.complaint.code=CF
server.tomcat.max-http-form-post-size=100MB
server.tomcat.max-swallow-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.max-file-size=100MB
# Stream every part straight to disk instead of buffering it in the heap. Without
# this a multi-document KYC request is held in memory and can push the container
# past its limit, where it is killed mid-request and the client sees
# "unexpected end of stream".
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=0
account.type.individual.code=10
account.cus.reg.type.code=C
status.approved.code=AP
sms.template.upgrade.parked.L2=AUR
sms.template.upgrade.approved.L2=AUG