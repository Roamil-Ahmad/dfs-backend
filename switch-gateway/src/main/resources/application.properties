spring.application.name=switch-gateway
server.port=${SERVER_PORT:9995}
server.servlet.context-path=/switch-gateway

# ---------------------------------------------------------------------------
# Switch simulator (mock 1LINK). All services run on the same host, so the
# gateway dials it directly - there is no proxy in front of it.
# ---------------------------------------------------------------------------
switch.host=${SWITCH_SIMULATOR_HOST:switch-simulator}
switch.port=${SWITCH_SIMULATOR_PORT:6661}
switch.connect-timeout-ms=30000
switch.reconnect-delay-ms=5000
switch.response-timeout-ms=60000
switch.idle-time-seconds=60

# ---------------------------------------------------------------------------
# Where 1LINK-originated (incoming) traffic is handed to the transaction layer.
# ---------------------------------------------------------------------------
transaction.layer.incoming.title-fetch.url=${TRANSACTIONS_BASE_URL:http://transactions:8009}/transactions/v1/ibft/incoming/titleFetch
transaction.layer.incoming.advice.url=${TRANSACTIONS_BASE_URL:http://transactions:8009}/transactions/v1/ibft/incoming/advice
transaction.layer.timeout-ms=60000

# ---------------------------------------------------------------------------
# Fixed technical 1LINK parameters for the DFS (acquirer) side.
#   DE-32 acquiring institution id, DE-24 network identifier,
#   DE-18 merchant type, DE-49 transaction currency.
# Transaction data (accounts, amount, references) never appears here.
# ---------------------------------------------------------------------------
onelink.acquirer-institution-code=999982
onelink.network-identifier=001
onelink.merchant-type=0003
onelink.currency-code=586
onelink.sender-country-code=0586
onelink.originator-details=DFS PAKISTAN

logging.level.root=INFO
logging.level.com.dfs.switchgateway=INFO

# ---------------------------------------------------------------------------
# Utility Bill Payment (1LINK UBP). DE-03 for the two messages.
# PROVISIONAL: the UBP section of the 1LINK Data Element Definitions is not in
# this repository, so these are the DFS working values and must be confirmed
# with 1LINK before certification. The simulator reads the same two values.
# ---------------------------------------------------------------------------
onelink.processing-code.bill-inquiry=380000
onelink.processing-code.bill-payment=500000
